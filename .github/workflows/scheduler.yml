name: TicketDive Tracker

on:
  schedule:
    - cron: '17 * * * *'  # 保険（0分は混むので避ける）。本命は cron-job.org からの起動
  workflow_dispatch:      # 手動テスト実行ボタン＋外部からの起動

# 外部起動とscheduleが重なっても同時に動かさない（seen_events.json の取り合い・二重通知を防ぐ）
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write         # seen_events.json を push するため

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # 固まったときに延々と動き続けないように

    steps:
      - name: リポジトリの読み込み
        uses: actions/checkout@v4

      - name: Python環境設定
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 必要なライブラリのインストール
        run: |
          pip install requests beautifulsoup4 playwright
          playwright install chromium --with-deps

      - name: スクリプト実行
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_GROUP_ID: ${{ secrets.LINE_GROUP_ID }}
        run: python main.py

      - name: 履歴(seen_events.json)の更新保存
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_events.json
          if git diff --staged --quiet; then
            echo "変更なし"
          else
            git commit -m "Update seen events"
            git pull --rebase
            git push
          fi
